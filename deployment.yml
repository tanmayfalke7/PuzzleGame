apiVersion: apps/v1
kind: Deployment
metadata:
  name: puzzle-deployment
  labels:
    app: puzzle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: puzzle
  template:
    metadata:
      labels:
        app: puzzle
    spec:
      containers:
      - name: puzzle
        image: YOUR_DOCKERHUB_USERNAME/puzzle-app:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: puzzle-service
spec:
  type: LoadBalancer
  selector:
    app: puzzle
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80